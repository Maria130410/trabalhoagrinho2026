<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agro Forte, Futuro Sustentável</title>
    <style>
        /* Estilos Gerais */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f5;
            color: #333;
            line-height: 1.6;
        }

        /* Modificação no Cabeçalho para suportar imagem com transparência */
        header {
            background-color: #1b4332; /* Cor de fundo caso a imagem falhe */
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            overflow: hidden; /* Garante que a imagem não saia do cabeçalho */
        }

        /* Pseudoelemento para controlar a imagem de fundo e sua opacidade */
        header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* COLOQUE O LINK OU CAMINHO DA SUA IMAGEM ABAIXO */
            background-image: url('CAMINHO_DA_SUA_IMAGEM.jpg'); 
            background-size: cover;
            background-position: center;
            opacity: 0.4; /* Ajuste a transparência aqui (0.0 totalmente invisível até 1.0 totalmente opaco) */
            z-index: -1; /* Garante que a imagem fique atrás do texto */
        }

        /* Container do cabeçalho com padding */
        .header-content {
            padding: 20px 0;
            position: relative; /* Mantém o conteúdo acima do ::before */
        }

        .container {
            width: 85%;
            max-width: 1200px;
            margin: 0 auto;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #52b788;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5); /* Sombra leve para destacar no fundo */
        }

        nav ul {
            display: flex;
            list-style: none;
        }

        nav ul li {
            margin-left: 20px;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5); /* Sombra leve para destacar no fundo */
        }

        nav ul li a:hover {
            color: #52b788;
        }

        /* Banner Principal */
        .hero {
            background-color: #2d6a4f;
            color: white;
            padding: 100px 0;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* Interação no Título Principal */
        .hero h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            transition: color 0.3s ease;
            cursor: default;
        }

        .hero h1:hover {
            color: #52b788;
        }

        .hero p {
            font-size: 1.2rem;
            max-width: 700px;
            margin: 0 auto 30px;
        }

        /* Estilização das Imagens */
        .image-container {
            width: 100%;
            overflow: hidden;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .hero-image-space {
            height: 350px;
            max-width: 800px;
            margin: 20px auto 0;
        }

        /* Seção de Conteúdo (Pesquisa) */
        .content-section {
            padding: 60px 0;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            align-items: center;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        /* Interação nas Seções de Título H2 */
        h2 {
            color: #1b4332;
            font-size: 2rem;
            margin-bottom: 20px;
            position: relative;
            transition: color 0.3s ease;
            cursor: default;
        }

        h2:hover {
            color: #52b788;
        }

        h2::after {
            content: '';
            display: block;
            width: 60px;
            height: 4px;
            background-color: #52b788;
            margin-top: 10px;
            transition: width 0.3s ease;
        }

        h2:hover::after {
            width: 100px;
        }

        .text-block p {
            margin-bottom: 15px;
            text-align: justify;
        }

        .highlight-box {
            background-color: #e9f5ed;
            border-left: 5px solid #2d6a4f;
            padding: 20px;
            margin: 20px 0;
            font-style: italic;
        }

        .side-image-space {
            height: 400px;
            width: 100%;
        }

        /* Galeria / Pilares */
        .pillars {
            background-color: #e9f5ed;
            padding: 60px 0;
        }

        .pillars-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 40px;
        }

        .pillar-card {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
            transition: transform 0.3s ease;
        }

        .pillar-card:hover {
            transform: translateY(-5px);
        }

        /* Interação nos Títulos dos Cards (H3) */
        .pillar-card h3 {
            color: #2d6a4f;
            margin-bottom: 15px;
            transition: color 0.3s ease;
        }

        .pillar-card:hover h3 {
            color: #52b788;
        }

        .card-image-space {
            height: 150px;
            margin-bottom: 15px;
        }

        /* Rodapé */
        footer {
            background-color: #1b4332;
            color: white;
            text-align: center;
            padding: 30px 0;
            margin-top: 40px;
        }

        footer p {
            font-size: 0.9rem;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <header>
        <div class="container header-content nav">
            <div class="logo">AgroForte 🌱</div>
            <nav>
                <ul>
                    <li><a href="#inicio">Início</a></li>
                    <li><a href="#pesquisa">A Pesquisa</a></li>
                    <li><a href="#pilares">Pilares</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section id="inicio" class="hero">
        <div class="container">
            <h1>Agro Forte, Futuro Sustentável</h1>
            <p>Como a tecnologia e a preservação ambiental estão transformando o campo e garantindo a segurança alimentar do planeta.</p>
            
            <div class="image-container hero-image-space">
                <img src="https://img.magnific.com/fotos-gratis/tractor-a-trabalhar-num-campo-verde_23-2151983626.jpg?
